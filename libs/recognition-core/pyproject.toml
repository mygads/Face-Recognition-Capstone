[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "presensi-recognition-core"
version = "0.1.0"
description = "Shared, model-agnostic face recognition pipeline package"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
opencv = ["numpy>=1.26", "opencv-python-headless>=4.10,<5"]

[project.scripts]
recognition-core = "recognition_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
