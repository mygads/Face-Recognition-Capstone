[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "presensi-ai-service"
version = "0.1.0"
description = "Central AI inference service for profile AI_CENTRAL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "Pillow>=10,<13",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8,<10"]
inference = ["numpy>=1.26", "opencv-python-headless>=4.10,<5"]

[tool.setuptools.packages.find]
where = ["src"]
