# Copy to edge-agent.yaml and edit values for this lab PC.
mode: AI_EDGE
device_id: null # Provide PRESENSI_EDGE_DEVICE_ID via the environment.

api:
  base_url: http://127.0.0.1:8000
  timeout_seconds: 4
  heartbeat_interval_seconds: 15
  cache_refresh_seconds: 3
  cache_max_offline_seconds: 300 # Local hard ceiling; server expiry may be sooner.
  cache_path: /api/v1/devices/{device_id}/active-session-cache?model_name={model_name}&model_version={model_version}
  token_file: null # Provision a device credential to this protected file.

camera:
  # Operasi realtime: 640x480 @ 15fps. 1080p hanya untuk diagnostik karena
  # YuNet cost skala dengan piksel (~6x piksel vs 480p) dan USB YUYV bisa
  # membunuh FPS sebelum inference mulai.
  index: 0
  width: 640
  height: 480
  fps: 15
  backend: auto # auto, dshow/MSMF on Windows, or v4l2 on Linux.
  scan_max_index: 8
  reconnect_seconds: 2

models:
  # Provision weights locally. Never fetch model files at runtime or commit them.
  yunet_path: ../../../models/weights/face_detection_yunet_2023mar.onnx
  sface_path: ../../../models/weights/face_recognition_sface_2021dec.onnx
  version: opencv-zoo-sface-2021dec
  liveness_path: null
  liveness_version: null

quality:
  # Tune with authorized camera samples during local validation.
  min_face_pixels: 80
  min_laplacian_variance: 45
  min_brightness: 25
  max_brightness: 235

recognition:
  # Populate both values from local benchmark/calibration before running.
  min_top1_similarity: null
  min_top1_top2_margin: null
  # Consensus must stay reachable inside one track lifetime:
  # ceil(track_ttl_seconds * camera fps / sample_every_n_frames)
  # must cover minimum_agreeing_frames (here 3s*15fps/6 = ~7 >= 3).
  # Startup refuses to run otherwise instead of stalling silently.
  minimum_agreeing_frames: 3
  sample_every_n_frames: 6
  best_frame_count: 5
  max_history_frames: 10
  track_ttl_seconds: 3
  # Calibrated YuNet operating point (confirm via local benchmark report).
  yunet_score_threshold: 0.9
  yunet_nms_threshold: 0.3
  # Detector input cap: YuNet runs on a downscaled copy and boxes are
  # mapped back; quality/align/embed still use the full frame. Default 640
  # keeps YuNet cheap; set 0 only for full-resolution diagnostics. Confirm
  # recall impact with the local calibration report before changing.
  detection_max_width: 640

liveness:
  # Keep disabled only with a documented physical/session control.
  enabled: false
  required: false
  min_live_score: null

preview:
  enabled: true
  bind_host: 127.0.0.1
  port: 8765
  allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  max_width: 640
  jpeg_quality: 70

runtime:
  outbox_path: ../data/camera-queue/edge-events.sqlite3
  max_outbox_events: 50000
  max_dead_letter_events: 5000
  max_retry_seconds: 60
  log_level: INFO
