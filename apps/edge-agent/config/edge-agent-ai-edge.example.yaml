# Copy to /etc/presensi-edge-agent/edge-agent.yaml and customize per device.
mode: AI_EDGE
device_id: null # Set PRESENSI_EDGE_DEVICE_ID in the systemd EnvironmentFile.

api:
  base_url: https://presensi.example.edu
  timeout_seconds: 4
  heartbeat_interval_seconds: 15
  cache_refresh_seconds: 3
  cache_max_offline_seconds: 300
  cache_path: /api/v1/devices/{device_id}/active-session-cache?model_name={model_name}&model_version={model_version}
  token_file: /var/lib/presensi-edge-agent/device.token

camera:
  # Operasi realtime: 640x480 @ 15fps. 1080p hanya untuk diagnostik karena
  # YuNet cost skala dengan piksel (~6x piksel vs 480p) dan USB YUYV bisa
  # membunuh FPS sebelum inference mulai.
  index: 0
  width: 640
  height: 480
  fps: 15
  backend: v4l2
  scan_max_index: 8
  reconnect_seconds: 2

models:
  yunet_path: /opt/presensi-edge-agent/models/face_detection_yunet_2023mar.onnx
  sface_path: /opt/presensi-edge-agent/models/face_recognition_sface_2021dec.onnx
  version: opencv-zoo-sface-2021dec
  liveness_path: null
  liveness_version: null

quality:
  min_face_pixels: 80
  min_laplacian_variance: 45
  min_brightness: 25
  max_brightness: 235

recognition:
  # Do not start production attendance until both values are locally calibrated.
  min_top1_similarity: null
  min_top1_top2_margin: null
  # Consensus must stay reachable inside one track lifetime:
  # ceil(track_ttl_seconds * camera fps / sample_every_n_frames)
  # must cover minimum_agreeing_frames (here 3s*15fps/6 = ~7 >= 3).
  # Startup refuses to run otherwise instead of stalling silently.
  minimum_agreeing_frames: 3
  sample_every_n_frames: 6
  best_frame_count: 5
  max_history_frames: 10
  track_ttl_seconds: 3
  # Calibrated YuNet operating point (confirm via local benchmark report).
  yunet_score_threshold: 0.9
  yunet_nms_threshold: 0.3
  # Detector input cap: YuNet runs on a downscaled copy and boxes are
  # mapped back; quality/align/embed still use the full frame. Default 640
  # keeps YuNet cheap; set 0 only for full-resolution diagnostics. Confirm
  # recall impact with the local calibration report before changing.
  detection_max_width: 640

liveness:
  enabled: false
  required: false
  min_live_score: null

preview:
  enabled: true
  # Loopback only: the dashboard preview uses this agent's existing webcam feed.
  bind_host: 127.0.0.1
  port: 8765
  allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  max_width: 640
  jpeg_quality: 70

runtime:
  outbox_path: /var/lib/presensi-edge-agent/edge-events.sqlite3
  max_outbox_events: 50000
  max_dead_letter_events: 5000
  max_retry_seconds: 60
  log_level: INFO
