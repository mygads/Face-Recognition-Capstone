name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_USER: presensi_ci
      DATABASE_PASSWORD: presensi_ci
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: presensi_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: presensi_ci
          POSTGRES_PASSWORD: presensi_ci
          POSTGRES_DB: presensi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presensi_ci -d presensi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python tooling and packages
        run: python -m pip install -r requirements-dev.txt

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
        working-directory: apps/api

      - name: Seed baseline roles
        run: python -m presensi_api.db.seed_roles
        working-directory: apps/api

      - name: Check database model and migration drift
        run: alembic check
        working-directory: apps/api

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run lint, type checks, and unit tests
        run: python scripts/check.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright E2E smoke tests
        run: npm run test:e2e
        working-directory: apps/web
