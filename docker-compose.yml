name: presensi-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PATH: apps/api
        INSTALL_RECOGNITION_CORE: "true"
    command: ["uvicorn", "presensi_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    working_dir: /service
    volumes:
      - ./apps/api:/service
      - "${PRESENSI_AI_MODELS_DIR:-./models/weights}:/models:ro"
    environment:
      APP_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:?Copy .env.example to .env first}
      DATABASE_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      PRESENSI_DEVICE_HEARTBEAT_TIMEOUT_SECONDS: ${PRESENSI_DEVICE_HEARTBEAT_TIMEOUT_SECONDS:-60}
      PRESENSI_FACE_TEMPLATE_KEYS: "${PRESENSI_FACE_TEMPLATE_KEYS:-}"
      PRESENSI_FACE_TEMPLATE_ACTIVE_KEY_ID: ${PRESENSI_FACE_TEMPLATE_ACTIVE_KEY_ID:-}
      PRESENSI_CORS_ALLOWED_ORIGINS: ${PRESENSI_CORS_ALLOWED_ORIGINS:-}
      PRESENSI_API_MAX_REQUEST_BYTES: ${PRESENSI_API_MAX_REQUEST_BYTES:-16777216}
      PRESENSI_DEVICE_API_REQUESTS_PER_MINUTE: ${PRESENSI_DEVICE_API_REQUESTS_PER_MINUTE:-120}
      PRESENSI_ENROLLMENT_REQUESTS_PER_MINUTE: ${PRESENSI_ENROLLMENT_REQUESTS_PER_MINUTE:-10}
      PRESENSI_RECOGNITION_EVENT_RETENTION_DAYS: ${PRESENSI_RECOGNITION_EVENT_RETENTION_DAYS:-90}
      PRESENSI_GALLERY_MAX_AGE_SECONDS: ${PRESENSI_GALLERY_MAX_AGE_SECONDS:-300}
      PRESENSI_ENROLLMENT_YUNET_MODEL_PATH: ${PRESENSI_ENROLLMENT_YUNET_MODEL_PATH:-}
      PRESENSI_ENROLLMENT_SFACE_MODEL_PATH: ${PRESENSI_ENROLLMENT_SFACE_MODEL_PATH:-}
      PRESENSI_ENROLLMENT_MODEL_VERSION: ${PRESENSI_ENROLLMENT_MODEL_VERSION:-}
      PRESENSI_ENROLLMENT_DUPLICATE_WARNING_THRESHOLD: ${PRESENSI_ENROLLMENT_DUPLICATE_WARNING_THRESHOLD:-0.85}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert response.status == 200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-service:
    profiles: [central]
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PATH: apps/ai-service
        SERVICE_EXTRAS: dev,inference
        INSTALL_RECOGNITION_CORE: "true"
    command: ["uvicorn", "presensi_ai_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    working_dir: /service
    volumes:
      - ./apps/ai-service:/service
      - "${PRESENSI_AI_MODELS_DIR:-./models/weights}:/models:ro"
    environment:
      APP_ENV: development
      PRESENSI_AI_CORE_API_BASE_URL: ${PRESENSI_AI_CORE_API_BASE_URL:-http://api:8000}
      PRESENSI_AI_YUNET_MODEL_PATH: ${PRESENSI_AI_YUNET_MODEL_PATH:-}
      PRESENSI_AI_SFACE_MODEL_PATH: ${PRESENSI_AI_SFACE_MODEL_PATH:-}
      PRESENSI_AI_MODEL_VERSION: ${PRESENSI_AI_MODEL_VERSION:-}
      PRESENSI_AI_MIN_TOP1_SIMILARITY: ${PRESENSI_AI_MIN_TOP1_SIMILARITY:-}
      PRESENSI_AI_MIN_TOP1_TOP2_MARGIN: ${PRESENSI_AI_MIN_TOP1_TOP2_MARGIN:-}
      PRESENSI_AI_INFERENCE_TIMEOUT_SECONDS: ${PRESENSI_AI_INFERENCE_TIMEOUT_SECONDS:-5}
      PRESENSI_AI_RATE_LIMIT_PER_SECOND: ${PRESENSI_AI_RATE_LIMIT_PER_SECOND:-10}
      PRESENSI_AI_RATE_LIMIT_BURST: ${PRESENSI_AI_RATE_LIMIT_BURST:-20}
      PRESENSI_AI_LIVENESS_ENABLED: ${PRESENSI_AI_LIVENESS_ENABLED:-false}
      PRESENSI_AI_LIVENESS_REQUIRED: ${PRESENSI_AI_LIVENESS_REQUIRED:-false}
      PRESENSI_AI_LIVENESS_MIN_SCORE: ${PRESENSI_AI_LIVENESS_MIN_SCORE:-}
      PRESENSI_AI_LIVENESS_MODEL_PATH: ${PRESENSI_AI_LIVENESS_MODEL_PATH:-}
      PRESENSI_AI_LIVENESS_MODEL_VERSION: ${PRESENSI_AI_LIVENESS_MODEL_VERSION:-}
    ports:
      - "${AI_SERVICE_BIND_ADDRESS:-127.0.0.1}:${AI_SERVICE_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2); assert response.status == 200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    profiles: [web-container]
    image: node:24-alpine
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./apps/web:/workspace
      - web-node-modules:/workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  postgres-data:
  web-node-modules:
