name: presensi-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PATH: apps/api
    command: ["uvicorn", "presensi_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    working_dir: /service
    volumes:
      - ./apps/api:/service
    environment:
      APP_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:?Copy .env.example to .env first}
      DATABASE_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert response.status == 200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-service:
    profiles: [central]
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PATH: apps/ai-service
    command: ["uvicorn", "presensi_ai_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    working_dir: /service
    volumes:
      - ./apps/ai-service:/service
    environment:
      APP_ENV: development
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2); assert response.status == 200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    profiles: [web-container]
    image: node:24-alpine
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./apps/web:/workspace
      - web-node-modules:/workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  postgres-data:
  web-node-modules:
