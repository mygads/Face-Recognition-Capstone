[tool.ruff]
target-version = "py311"
line-length = 88
src = [
  "apps/api/src",
  "apps/ai-service/src",
  "apps/edge-agent/src",
  "libs/recognition-core/src",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
  "presensi_api",
  "presensi_ai_service",
  "presensi_edge_agent",
  "recognition_core",
]

[tool.mypy]
# Match CI's Python 3.12 so third-party NumPy stubs using PEP 695 parse correctly.
python_version = "3.12"
strict = true
mypy_path = [
  "apps/ai-service/src",
  "apps/edge-agent/src",
  "libs/recognition-core/src",
]
files = [
  "apps/api/src",
  "apps/api/tests",
  "apps/ai-service/src",
  "apps/ai-service/tests",
  "apps/edge-agent/src",
  "libs/recognition-core/src",
  "tests/ai-benchmark",
  "tests/deployment-benchmark",
  "scripts",
]

[tool.pytest.ini_options]
testpaths = ["apps", "libs", "tests"]
pythonpath = [
  "apps/api/src",
  "apps/ai-service/src",
  "apps/edge-agent/src",
  "libs/recognition-core/src",
]
addopts = "-ra"
